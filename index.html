<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 破冰成功！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(125deg, #fdfbfb 0%, #ebedee 100%);
      padding: 20px;
    }

    /* 粉彩漸層卡片 */
    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ffd1ff 0%, #fae1dd 45%, #d0e8ff 100%);
      box-shadow: 0 20px 45px rgba(180, 160, 210, 0.28),
                  0 8px 16px rgba(0, 0, 0, 0.04);
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #3d3460;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
    }

    /* 精美發光按鈕 */
    .glow-btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 15px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      border-radius: 50px;
      background: linear-gradient(135deg, #7f53ac 0%, #647dee 100%);
      box-shadow: 0 0 22px rgba(100, 125, 238, 0.55),
                  0 4px 12px rgba(0, 0, 0, 0.12);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .glow-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 32px rgba(100, 125, 238, 0.8),
                  0 6px 18px rgba(0, 0, 0, 0.16);
    }

    .glow-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 16px rgba(100, 125, 238, 0.6);
    }

    /* 點擊資訊與鼓勵語區域 */
    .status-panel {
      margin-top: 30px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .counter {
      font-size: 0.98rem;
      color: #584a75;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.55);
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-block;
    }

    .quote-box {
      font-size: 1.05rem;
      color: #2e2646;
      font-weight: 600;
      line-height: 1.5;
      padding: 0 8px;
      opacity: 1;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .quote-box.fade-out {
      opacity: 0;
      transform: translateY(4px);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Antigravity 破冰成功！</h1>

    <button id="glowBtn" class="glow-btn">點擊領取正能量</button>

    <div class="status-panel">
      <div id="counter" class="counter">尚未點擊</div>
      <div id="quoteBox" class="quote-box">點擊上方按鈕，開啟新旅程 ✨</div>
    </div>
  </div>

  <script>
    const quotes = [
      "太棒了！保持這個前進的節奏！🚀",
      "每一步微小的累積，都是未來的奇蹟 ✨",
      "勇於探索未知，世界因你的好奇而精彩 🌟",
      "今天的努力，是明天最堅實的底氣 💪",
      "突破自我邊界，發現更多可能性 🎈",
      "相信自己，你擁有的能量遠超想像 💫",
      "保持熱愛，奔赴屬於你的星辰大海 🪐",
      "破冰只是第一步，精彩才剛剛開始！🎉"
    ];

    let count = 0;
    let lastIndex = -1;

    const btn = document.getElementById("glowBtn");
    const counterEl = document.getElementById("counter");
    const quoteBoxEl = document.getElementById("quoteBox");

    btn.addEventListener("click", () => {
      count++;
      counterEl.textContent = `已點擊：${count} 次`;

      // 隨機挑選鼓勵小語（避免連續選到相同的一句）
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * quotes.length);
      } while (quotes.length > 1 && randomIndex === lastIndex);
      lastIndex = randomIndex;

      // 文字更新動畫
      quoteBoxEl.classList.add("fade-out");
      setTimeout(() => {
        quoteBoxEl.textContent = quotes[randomIndex];
        quoteBoxEl.classList.remove("fade-out");
      }, 150);
    });
  </script>
</body>
</html>
